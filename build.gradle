plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "CurseForge"
		url = "https://maven.curseforge.com/api/maven"
		content {
			includeGroup "curse.maven"
		}
	}
	maven { url "https://maven.isxander.dev/releases" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"atmos" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change versions see gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium
	modImplementation "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"

	// Iris
	modImplementation "maven.modrinth:iris:1.8.8+1.21.1-fabric"

	// Mod Menu & YACL
	modImplementation "dev.isxander:yet-another-config-lib:3.5.0+1.21-fabric"
	modImplementation "com.terraformersmc:modmenu:11.0.2"

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Bundles the LICENSE file into the jar, renamed to LICENSE_atmos.
	// All Rights Reserved — redistribution is not permitted.
	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add publishing repositories here if needed.
	}
}